<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 1592" id="svgDiagrama"><style>:root{--blue:#1976a8;--yellow:#f2b01e;--red:#d32f2f}
