<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     id="svgDiagrama"
     viewBox="0 0 857 1111">
  <style>
    :root {
      --blue: #1976a8;
      --yellow: #f2b01e;
      --red: #d32f2f;
    }
    .moldura-rect {
      fill: none;
      stroke: #000;
      stroke-width: 4;
    }
    .linha-conexao {
      fill: none;
      stroke: #777;
      stroke-width: 2;
    }
    .interm-circle {
      fill: #fff;
      stroke: #777;
      stroke-width: 2;
    }
    .hub-circle {
      fill: #fff;
      stroke: #000;
      stroke-width: 2;
    }
    .hub-text, .cav-text {
      fill: #000;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      font-family: Arial, sans-serif;
      font-weight: 700;
    }
    .hub-text { font-size: 12px; }
    .cav-text { font-size: 16px; }
    .cav-circle {
      cursor: pointer;
      transition: filter .15s;
    }
    .cav-circle:hover { filter: brightness(.88); }
    .cav-circle.cav-selecionada-svg {
      filter: drop-shadow(0 0 6px var(--blue));
      stroke: var(--blue);
      stroke-width: 5;
    }
    .status-normal {
      fill: #fff;
      stroke: #000;
      stroke-width: 2;
    }
    .status-defeito {
      fill: var(--yellow);
      stroke: #a66d00;
      stroke-width: 2;
    }
    .status-vedado {
      fill: var(--red);
      stroke: #a92323;
      stroke-width: 2;
    }
    .status-vedado-txt { fill: #fff !important; }
  </style>

  <defs>
    <!-- Todos os conjuntos usam exatamente a mesma geometria. -->
    <g id="estrutura-alinhada">
      <path class="linha-conexao"
            d="M 0,-88 V 88
               M -88,0 H 88
               M -40,-132 L 0,-88 L 40,-132
               M -132,-40 L -88,0 L -132,40
               M -40,132 L 0,88 L 40,132
               M 132,-40 L 88,0 L 132,40"/>
      <circle class="interm-circle" cx="0" cy="-88" r="6"/>
      <circle class="interm-circle" cx="-88" cy="0" r="6"/>
      <circle class="interm-circle" cx="0" cy="88" r="6"/>
      <circle class="interm-circle" cx="88" cy="0" r="6"/>
      <circle class="hub-circle" cx="0" cy="0" r="19"/>
    </g>
  </defs>

  <rect class="moldura-rect" x="4" y="4" width="849" height="1103"/>

