    <text class="cav-text" data-cav="3"
          x="-180" y="60">3</text>

    <circle class="cav-circle status-normal" data-cav="4"
            cx="-60" cy="180" r="40"/>
    <text class="cav-text" data-cav="4"
          x="-60" y="180">4</text>

    <circle class="cav-circle status-normal" data-cav="5"
