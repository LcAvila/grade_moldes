<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     id="svgDiagrama"
     viewBox="0 0 1075 1030">

  <style>
    :root {
      --blue: #1976a8;
      --yellow: #f2b01e;
      --red: #d32f2f;
    }

    .moldura-rect {
      fill: none;
      stroke: #000;
      stroke-width: 4;
    }

    .linha-conexao {
      fill: none;
      stroke: #777;
      stroke-width: 2;
    }

    .interm-circle {
      fill: #fff;
      stroke: #777;
      stroke-width: 2;
    }

    .hub-circle {
      fill: #fff;
      stroke: #000;
      stroke-width: 2;
    }

    .hub-text, .cav-text {
      fill: #000;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      font-family: Arial, sans-serif;
      font-weight: 700;
    }

    .hub-text { font-size: 20px; }
    .cav-text { font-size: 30px; }

    .cav-circle {
      cursor: pointer;
      transition: filter .15s;
    }

    .cav-circle:hover {
      filter: brightness(.88);
    }

    .cav-circle.cav-selecionada-svg {
      filter: drop-shadow(0 0 6px var(--blue));
      stroke: var(--blue);
      stroke-width: 5;
    }

    .status-normal {
      fill: #fff;
      stroke: #000;
      stroke-width: 2;
    }

    .status-defeito {
      fill: var(--yellow);
      stroke: #a66d00;
      stroke-width: 2;
    }

    .status-vedado {
      fill: var(--red);
      stroke: #a92323;
      stroke-width: 2;
    }

    .status-vedado-txt {
      fill: #fff !important;
    }
  </style>

  <defs>
    <!-- Geometria idêntica para as quatro zonas. -->
    <g id="estrutura-zona-193">
      <!-- Eixos centrais retos. -->
      <path class="linha-conexao"
            d="M 0,-120 V 120
               M -120,0 H 120"/>

      <!-- Ramificações simétricas a 45 graus. -->
      <path class="linha-conexao"
            d="M -60,-180 L 0,-120 L 60,-180
               M -180,-60 L -120,0 L -180,60
               M -60,180 L 0,120 L 60,180
               M 180,-60 L 120,0 L 180,60"/>

      <circle class="interm-circle" cx="0" cy="-120" r="11"/>
      <circle class="interm-circle" cx="-120" cy="0" r="11"/>
      <circle class="interm-circle" cx="0" cy="120" r="11"/>
      <circle class="interm-circle" cx="120" cy="0" r="11"/>

      <circle class="hub-circle" cx="0" cy="0" r="31"/>
    </g>
  </defs>

  <rect class="moldura-rect"
        x="4" y="4" width="1067" height="1022"/>

  <!-- ZONA 1: superior esquerda — cavidades 1 a 8. -->
  <g id="zona-1" transform="translate(245 260)">
    <use href="#estrutura-zona-193"/>
    <text class="hub-text" x="0" y="0">1</text>

    <circle class="cav-circle status-normal" data-cav="1"
            cx="-60" cy="-180" r="40"/>
    <text class="cav-text" data-cav="1"
          x="-60" y="-180">1</text>

    <circle class="cav-circle status-normal" data-cav="2"
            cx="-180" cy="-60" r="40"/>
    <text class="cav-text" data-cav="2"
          x="-180" y="-60">2</text>

    <circle class="cav-circle status-normal" data-cav="3"
