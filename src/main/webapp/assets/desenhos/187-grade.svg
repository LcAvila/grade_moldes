<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 501 435" id="svgDiagrama"><style>:root{--blue:#1976a8;--yellow:#f2b01e;--red:#d32f2f}
.moldura-rect{fill:none;stroke:#000;stroke-width:4}
.cav-circle{cursor:pointer;transition:filter .15s}
.cav-circle:hover{filter:brightness(.88)}
.cav-circle.cav-selecionada-svg{filter:drop-shadow(0 0 6px var(--blue));stroke:var(--blue);stroke-width:5}
.cav-text{pointer-events:none;fill:#000;text-anchor:middle;dominant-baseline:central}
.status-vedado-txt{fill:#fff!important}
.interm-circle{fill:#fff;stroke:#777;stroke-width:2}
.hub-circle{fill:#fff;stroke:#000;stroke-width:2}
.hub-text{fill:#000;text-anchor:middle;dominant-baseline:central}
.linha-conexao{fill:none;stroke:#777;stroke-width:2}
.status-normal{fill:#fff;stroke:#000;stroke-width:2}
.status-defeito{fill:var(--yellow);stroke:#a66d00;stroke-width:2}
.status-vedado{fill:var(--red);stroke:#a92323;stroke-width:2}</style><rect x="4" y="4" width="493" height="427" class="moldura-rect" /><circle cx="81.5" cy="81.5" r="64" class="cav-circle status-normal" data-cav="1" /><text x="81.5" y="81.5" class="cav-text" style="font:700 49px Arial,sans-serif" data-cav="1">1</text><circle cx="81.5" cy="352.5" r="64" class="cav-circle status-normal" data-cav="2" /><text x="81.5" y="352.5" class="cav-text" style="font:700 49px Arial,sans-serif" data-cav="2">2</text><circle cx="418.5" cy="81.5" r="64" class="cav-circle status-normal" data-cav="3" /><text x="418.5" y="81.5" class="cav-text" style="font:700 49px Arial,sans-serif" data-cav="3">3</text><circle cx="418.5" cy="352.5" r="64" class="cav-circle status-normal" data-cav="4" /><text x="418.5" y="352.5" class="cav-text" style="font:700 49px Arial,sans-serif" data-cav="4">4</text></svg>