<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 862 818" id="svgDiagrama"><style>:root{--blue:#1976a8;--yellow:#f2b01e;--red:#d32f2f}
.moldura-rect{fill:none;stroke:#000;stroke-width:4}
.cav-circle{cursor:pointer;transition:filter .15s}
.cav-circle:hover{filter:brightness(.88)}
.cav-circle.cav-selecionada-svg{filter:drop-shadow(0 0 6px var(--blue));stroke:var(--blue);stroke-width:5}
.cav-text{pointer-events:none;fill:#000;text-anchor:middle;dominant-baseline:central}
.status-vedado-txt{fill:#fff!important}
.interm-circle{fill:#fff;stroke:#777;stroke-width:2}
.hub-circle{fill:#fff;stroke:#000;stroke-width:2}
.hub-text{fill:#000;text-anchor:middle;dominant-baseline:central}
.linha-conexao{fill:none;stroke:#777;stroke-width:2}
.status-normal{fill:#fff;stroke:#000;stroke-width:2}
.status-defeito{fill:var(--yellow);stroke:#a66d00;stroke-width:2}
.status-vedado{fill:var(--red);stroke:#a92323;stroke-width:2}</style><rect x="4" y="4" width="854" height="810" class="moldura-rect" /><circle cx="195" cy="191.5" r="63" class="cav-circle status-normal" data-cav="1" /><text x="195" y="191.5" class="cav-text" style="font:700 48px Arial,sans-serif" data-cav="1">1</text><circle cx="82" cy="408" r="64" class="cav-circle status-normal" data-cav="2" /><text x="82" y="408" class="cav-text" style="font:700 49px Arial,sans-serif" data-cav="2">2</text><circle cx="195" cy="618" r="64" class="cav-circle status-normal" data-cav="3" /><text x="195" y="618" class="cav-text" style="font:700 49px Arial,sans-serif" data-cav="3">3</text><circle cx="442.5" cy="735" r="63" class="cav-circle status-normal" data-cav="4" /><text x="442.5" y="735" class="cav-text" style="font:700 48px Arial,sans-serif" data-cav="4">4</text><circle cx="683" cy="618" r="64" class="cav-circle status-normal" data-cav="5" /><text x="683" y="618" class="cav-text" style="font:700 49px Arial,sans-serif" data-cav="5">5</text><circle cx="779" cy="411.5" r="63" class="cav-circle status-normal" data-cav="6" /><text x="779" y="411.5" class="cav-text" style="font:700 48px Arial,sans-serif" data-cav="6">6</text><circle cx="697" cy="195" r="64" class="cav-circle status-normal" data-cav="7" /><text x="697" y="195" class="cav-text" style="font:700 49px Arial,sans-serif" data-cav="7">7</text><circle cx="446" cy="81.5" r="63" class="cav-circle status-normal" data-cav="8" /><text x="446" y="81.5" class="cav-text" style="font:700 48px Arial,sans-serif" data-cav="8">8</text></svg>