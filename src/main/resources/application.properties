# =====================================================================
# CustomFusionWeb - configuracao
# Valores podem ser sobrescritos por variaveis de ambiente
# (ex.: APP_FUSION_API_TOKEN -> app.fusion.api-token).
# =====================================================================

# --- Persistencia operacional (cavidades) -----------------------------
# fusion = formulario do Fusion Platform (recomendado, caminho aprovado)
# mysql  = tabelas MySQL do projeto (cavidades/moldes)
app.persistencia=fusion
app.fusion.formulario-cavidade=CavidadeNaoConforme

# --- Identificacao de usuario (sem tela de login) ---------------------
# FQN da classe PortalUtil do Fusion, usada via reflexao.
# Deixe vazio para usar os candidatos embutidos; se nenhum acertar,
# descubra no projeto Fusion (Eclipse: F3 na classe) e preencha aqui.
app.fusion.portal-util-class=
# Usuario de DESENVOLVIMENTO LOCAL (sem Fusion). Vazio = exige sessao
# do Fusion em toda chamada /api/*.
app.dev.usuario=

# FQN das classes do SDK Fusion para gravar no formulario (reflexao).
# Necessario apenas se os candidatos embutidos nao acertarem.
# Ver docs/arquitetura-fusion.md (secao "Descobrir os FQN").
app.fusion.adapter-utils-class=
app.fusion.entity-wrapper-class=
app.fusion.persist-engine-class=

# --- Banco MySQL (somente app.persistencia=mysql) ---------------------
app.db.url=jdbc:mysql://localhost:3306/cavidades_hml?useSSL=false&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
app.db.user=cavidades_app
app.db.password=SUA_SENHA_AQUI

# --- GED do Fusion (publicacao de documentos) -------------------------
# POST {base-url}/fusion/api/v1/documents  (header: Token)
app.fusion.base-url=
app.fusion.api-token=
app.fusion.doc-type=RELATORIO_CAVIDADES
app.fusion.folder-base=Qualidade\\Moldes
# published (padrao) ou edition (quando houver assinatura eletronica)
app.fusion.doc-status=published
# JSON opcional com campos extras exigidos pelo tipo de documento,
# ex.: {"title":"Relatorio de cavidades","codigo":"R001"}
app.fusion.doc-fields-extra=
# Author de contingencia quando nao houver sessao (geralmente vazio;
# o autor obrigatorio vem do usuario logado no Fusion).
app.fusion.author-padrao=

# --- Autodesk Platform Services (APS) ---------------------------------
# Crie um app em https://aps.autodesk.com/myapps e informe as credenciais.
# Sem client-id/client-secret o 3D usa o viewer Three.js local (fallback),
# sem enviar nenhum arquivo para a nuvem.
app.aps.client-id=
app.aps.client-secret=
# Bucket OSS. Vazio = derivado do Client ID (precisa ser unico na Autodesk).
app.aps.bucket=
# Viewer oficial (versao fixa para evitar mudanca silenciosa de comportamento).
app.aps.viewer-version=7.100.0
app.aps.env=AutodeskProduction2
app.aps.api=streamingV2
# Cache dos URNs ja traduzidos. Vazio = %TEMP%/customfusion-aps-cache.json.
app.aps.cache-file=
